name: Translate Bhagavad Gita

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "Vidhwaan GitHub Actions"
          git config user.email "actions@github.com"

      - name: Verify required files
        run: |
          test -f gita.json
          test -f translation-config.json
          test -f translation-glossary.json
          test -f translate-gita.js
          test -f validate-gita.js
          test -f validate-translation.js
          test -f package.json

      - name: Validate source
        run: |
          node validate-gita.js

      - name: Translate, validate and commit each language
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e

          LANGUAGES=(
            "en"
            "as"
            "bn"
            "brx"
            "doi"
            "gu"
            "hi"
            "kn"
            "ks"
            "kok"
            "mai"
            "ml"
            "mni"
            "mr"
            "ne"
            "or"
            "pa"
            "sa"
            "sat"
            "sd"
            "ta"
            "te"
            "ur"
          )

          for LANGUAGE in "${LANGUAGES[@]}"; do
            echo ""
            echo "=============================================="
            echo "PROCESSING LANGUAGE: $LANGUAGE"
            echo "=============================================="

            echo ""
            echo "Translating $LANGUAGE..."
            node translate-gita.js "$LANGUAGE"

            echo ""
            echo "Running structural validation..."
            node validate-gita.js

            echo ""
            echo "Running semantic validation for $LANGUAGE..."
            node validate-translation.js "$LANGUAGE"

            echo ""
            echo "Checking Git changes..."
            git status --short

            echo ""
            echo "Committing $LANGUAGE..."

            git add \
              english.json \
              assamese.json \
              bengali.json \
              bodo.json \
              dogri.json \
              gujarati.json \
              hindi.json \
              kannada.json \
              kashmiri.json \
              konkani.json \
              maithili.json \
              malayalam.json \
              manipuri.json \
              marathi.json \
              nepali.json \
              odia.json \
              punjabi.json \
              sanskrit.json \
              santali.json \
              sindhi.json \
              tamil.json \
              telugu.json \
              urdu.json \
              *.validation.json

            if git diff --cached --quiet; then
              echo "No changes to commit for $LANGUAGE."
            else
              git commit -m "Add Bhagavad Gita $LANGUAGE translation"
              git push
            fi

            echo ""
            echo "=============================================="
            echo "COMPLETED AND PUSHED: $LANGUAGE"
            echo "=============================================="
          done

      - name: Final validation
        run: |
          node validate-gita.js

      - name: Final Git status
        run: |
          git status --short
