name: Translate Bhagavad Gita

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "Vidhwaan GitHub Actions"
          git config user.email "actions@github.com"

      - name: Verify source files
        run: |
          test -f gita.json
          test -f translation-config.json
          test -f translation-glossary.json
          test -f translate-gita.js
          test -f validate-gita.js
          test -f validate-translation.js
          test -f package.json

      - name: Validate source
        run: |
          node validate-gita.js

      - name: Translate Bhagavad Gita
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node translate-gita.js

      - name: Validate generated JSON
        run: |
          node validate-gita.js

      - name: Semantic validation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node validate-translation.js

      - name: Check generated files
        run: |
          git status --short

      - name: Commit generated translations
        run: |
          git add \
            english.json \
            assamese.json \
            bengali.json \
            bodo.json \
            dogri.json \
            gujarati.json \
            hindi.json \
            kannada.json \
            kashmiri.json \
            konkani.json \
            maithili.json \
            malayalam.json \
            manipuri.json \
            marathi.json \
            nepali.json \
            odia.json \
            punjabi.json \
            sanskrit.json \
            santali.json \
            sindhi.json \
            tamil.json \
            telugu.json \
            urdu.json \
            *.validation.json

          if git diff --cached --quiet; then
            echo "No new translation files to commit."
          else
            git commit -m "Add Bhagavad Gita multilingual translations"
            git push
          fi
